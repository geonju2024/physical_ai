  <rect class="cp" x="616" y="208" width="300" height="64" rx="12"/>
  <text class="ttl cp-t" x="766" y="234">NVMe SSD · Wi-Fi 6E</text>
  <text class="sub cp-s" x="766" y="256">PCIe Gen4 · M.2 Key E · 3.3V</text>

  <rect class="out" x="616" y="292" width="300" height="64" rx="12" stroke-dasharray="6 4"/>
  <text class="ttl out-t" x="766" y="318">마이크 · 스피커 (Phase 2)</text>
  <text class="sub out-s" x="766" y="340">USB Audio · I2S · 5V</text>

  <rect class="cp" x="616" y="420" width="300" height="64" rx="12"/>
  <text class="ttl cp-t" x="766" y="446">센서 3종</text>
  <text class="sub cp-s" x="766" y="468">ToF (UART) · PIR (GPIO) · 조도 (I2C)</text>

  <rect class="out" x="616" y="504" width="300" height="64" rx="12"/>
  <text class="ttl out-t" x="766" y="530">고연색 LED 5000K</text>
  <text class="sub out-s" x="766" y="552">24V 1.25A · PWM 25kHz</text>

  <text class="note" x="480" y="626" text-anchor="middle">모든 GND 공통 연결</text>
  <line x1="32" y1="640" x2="928" y2="640" stroke="#C4C7C7" stroke-width="2" stroke-dasharray="10 7"/>

  <line x1="250" y1="684" x2="290" y2="684" class="power"/>
  <text class="note" x="300" y="688">전원</text>
  <line x1="360" y1="684" x2="400" y2="684" class="sig"/>
  <text class="note" x="410" y="688">신호 · 통신</text>
  <rect x="510" y="676" width="16" height="16" rx="4" class="cp"/>
  <text class="note" x="534" y="688">연산 · 입력</text>
  <rect x="620" y="676" width="16" height="16" rx="4" class="out"/>
  <text class="note" x="644" y="688">출력 장치</text>
