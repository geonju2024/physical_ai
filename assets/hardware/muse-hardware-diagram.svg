<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" role="img" aria-labelledby="t d" font-family="'Plus Jakarta Sans','Noto Sans KR',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MUSE 하드웨어 부품 관계도</title>
  <desc id="d">24V SMPS가 DC-DC 컨버터 3개와 LED에 전원을 공급하고, Jetson Orin NX가 카메라·디스플레이·저장장치·음성 장치를, ESP32-S3가 센서와 LED를 제어한다.</desc>
  <style>
    .pw{fill:#FDF6E8;stroke:#D99A2B;stroke-width:2}
    .cp{fill:#F3F0FF;stroke:#9D8DF1;stroke-width:2}
    .cpm{fill:#F3F0FF;stroke:#7B6AE0;stroke-width:3}
    .out{fill:#FDF2F8;stroke:#F472B6;stroke-width:2}
    .ttl{font-size:15px;font-weight:600;text-anchor:middle}
    .sub{font-size:12.5px;text-anchor:middle}
    .pw-t{fill:#7A4E0B}.pw-s{fill:#9A6A1F}
    .cp-t{fill:#2E2675}.cp-s{fill:#5A4FB0}
    .out-t{fill:#831843}.out-s{fill:#A3336B}
    .power{fill:none;stroke:#D99A2B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .sig{fill:none;stroke:#9D8DF1;stroke-width:2;stroke-dasharray:7 5}
    .note{font-size:12.5px;fill:#74777F}
  </style>

  <path class="power" d="M56 272H32V72H56M32 156H56M32 272V470H56"/>
  <path class="power" d="M156 40V20H580V140H616"/>
  <path class="power" d="M256 156H316"/>
  <path class="power" d="M256 470H316"/>
  <path class="power" d="M32 470V600H766V568"/>

  <path class="sig" d="M536 72H616M536 170H616M536 240H616M536 324H616"/>
  <path class="sig" d="M426 356V420"/>
  <path class="sig" d="M536 452H616M536 500H576V536H616"/>

  <rect class="pw" x="56" y="40" width="200" height="64" rx="12"/>
  <text class="ttl pw-t" x="156" y="66">DC-DC 12V-A</text>
  <text class="sub pw-s" x="156" y="88">SD-100B-12 · 디스플레이</text>

  <rect class="pw" x="56" y="124" width="200" height="64" rx="12"/>
  <text class="ttl pw-t" x="156" y="150">DC-DC 12V-B</text>
  <text class="sub pw-s" x="156" y="172">SD-100B-12 · Jetson</text>

  <rect class="pw" x="56" y="240" width="200" height="64" rx="12"/>
  <text class="ttl pw-t" x="156" y="266">SMPS 24V 350W</text>
  <text class="sub pw-s" x="156" y="288">UHP-350-24 · AC 입력</text>

  <rect class="pw" x="56" y="438" width="200" height="64" rx="12"/>
  <text class="ttl pw-t" x="156" y="464">DC-DC 5V</text>
  <text class="sub pw-s" x="156" y="486">SD-25B-5 · ESP32</text>

  <rect class="cpm" x="316" y="40" width="220" height="316" rx="14"/>
  <text class="ttl cp-t" x="426" y="176" style="font-size:17px">Jetson Orin NX 16GB</text>
  <text class="sub cp-s" x="426" y="200">메인 AI 연산 · Edge 추론</text>
  <text class="sub cp-s" x="426" y="220">12V · 최대 약 35W</text>

  <rect class="cpm" x="316" y="420" width="220" height="100" rx="14"/>
  <text class="ttl cp-t" x="426" y="456" style="font-size:17px">ESP32-S3</text>
  <text class="sub cp-s" x="426" y="478">센서 · 실시간 제어</text>
  <text class="sub cp-s" x="426" y="498">5V · 최대 350mA</text>

  <text class="note" x="436" y="392">USB-CDC 115200bps</text>

  <rect class="cp" x="616" y="40" width="300" height="64" rx="12"/>
  <text class="ttl cp-t" x="766" y="66">카메라 2종</text>
  <text class="sub cp-s" x="766" y="88">RealSense D455 (USB 3.1) · IMX477 (CSI-2)</text>

  <rect class="out" x="616" y="124" width="300" height="64" rx="12"/>
